<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <div class="container">
    <header>
      <h1>Weather Dashboard</h1>
      <form id="search-form">
        <input
          type="text"
          id="city-input"
          placeholder="Enter city name..."
          autocomplete="off"
        >
        <button type="submit">Search</button>
      </form>
    </header>

    <div id="error" class="error hidden"></div>
    <div id="loading" class="loading hidden">Loading...</div>

    <section id="current-weather" class="card hidden">
      <h2 id="city-name"></h2>
      <div class="current-main">
        <div class="temperature">
          <span id="current-temp"></span><span class="unit">°F</span>
        </div>
        <div class="condition">
          <img id="weather-icon" src="" alt="">
          <span id="weather-desc"></span>
        </div>
      </div>
      <div class="details">
        <div class="detail-item">
          <span class="detail-label">Humidity</span>
          <span id="humidity" class="detail-value"></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Feels Like</span>
          <span id="feels-like" class="detail-value"></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Wind</span>
          <span id="wind" class="detail-value"></span>
        </div>
      </div>
    </section>

    <section id="forecast" class="card hidden">
      <h2>5-Day Forecast</h2>
      <div id="forecast-cards" class="forecast-grid"></div>
    </section>
  </div>

  <script src="config.js?v=3"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
